server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Версия nginx не раскрывается в заголовке Server и на страницах ошибок
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Браузер не угадывает тип ответа по содержимому. add_header в location
  # отменяет унаследованные, поэтому nosniff повторяется в каждом из них
  add_header X-Content-Type-Options "nosniff" always;

  # Имена файлов в assets/ содержат хеш содержимого: кеш без повторной проверки.
  # Без expires: он добавил бы второй заголовок Cache-Control
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # SPA: неизвестный путь отдаёт index.html, дальше маршрутизирует приложение
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
