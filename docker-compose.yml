# Сборка и запуск клиента как статики за nginx. Переменные берутся из .env
# (см. .env.example). VITE_API_URL вшивается в бандл на этапе сборки: после
# его смены нужен `docker compose build`, перезапуска недостаточно.
services:
  client:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-3000}:8080'
