"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Файлы вне git, которые копируются в новый воркспейс
file_include_globs = """
.env*
.claude
"""

[scripts]
setup = "yarn install --immutable"
# Воркспейсы запускаются параллельно: у каждого свой порт из CONDUCTOR_PORT
run_mode = "concurrent"

[scripts.run.dev]
available_in = ["local"]
command = "yarn dev --port $CONDUCTOR_PORT --strictPort"
default = true
icon = "play"

[scripts.run.test]
command = "yarn test --watch"
icon = "test-tube"
